android.enableJetifier=false
android.useAndroidX=true
## AGP 8 backward compatibility switches
# https://developer.android.com/build/releases/agp-8-0-0-release-notes
#android.nonTransitiveRClass=true
#android.nonFinalResIds=false
## AGP 9 backward compatibility switches
# https://developer.android.com/build/releases/agp-9-0-0-release-notes
#android.defaults.buildfeatures.resvalues=true
#android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
#android.enableAppCompileTimeRClass=false
#android.usesSdkInManifest.disallowed=false
#android.uniquePackageNames=false
#android.dependency.useConstraints=true
#android.r8.strictFullModeForKeepRules=false
#android.r8.optimizedResourceShrinking=false
#android.builtInKotlin=false
#android.newDsl=false
# (all,fail,summary*,none) *default
org.gradle.warning.mode=all
# default is -Xmx512m "-XX:MaxMetaspaceSize=384m"
org.gradle.jvmargs='-Dfile.encoding=UTF-8'
systemProp.file.encoding=utf-8
# (normal*,low) *default
org.gradle.priority=low
# default is number of CPU processors
#org.gradle.workers.max=2