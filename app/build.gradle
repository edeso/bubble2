android {
    //compileSdk = 36
    compileSdk {
        version = release(37) {
            // this block and its properties are optional
            minorApiLevel = 2
            //sdkExtension = 18
        }
        //version = preview("CinnamonBun")
    }
    //buildToolsVersion '28.0.3'

    defaultConfig {
        applicationId = "com.github.edeso.bubble2"
        namespace = "com.nkanaev.comics"

        minSdk = 21
        targetSdk = 37
        //targetSdkPreview = "CinnamonBun"

        vectorDrawables.useSupportLibrary = true

        versionName = getVersionName()
        versionCode = getVersionCode()
        //setProperty("archivesBaseName", applicationId + "-v" + versionCode + "(" + versionName + ")")
        base.archivesName = "Bubble2-${versionName}"

        manifestPlaceholders = [
                appIcon: "@drawable/icon_squared"
        ]
   }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    buildFeatures {
        buildConfig = true
        // currently unused (allow dynamic resvalue setting)
        resValues = true
    }

    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-DEBUG'
            manifestPlaceholders = [
                    appIcon: "@drawable/icon_squared_debug"
            ]
        }
        release {
            // can't use either of the below, f**ks up JP2 support

            // Enables code shrinking, obfuscation, and optimization for only
            // your project's release build type.
            minifyEnabled = false
            // Enables resource shrinking, which is performed by the
            // Android Gradle plugin.
            shrinkResources = false
        }
    }
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/DEPENDENCIES.txt', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
    dependenciesInfo {
        /**
        * BLOB that's supposed to be just a binary representation of your app's 
        * dependency tree. But as it's encrypted with a public key belonging
        * to Google, only Google can read it – and nobody else can even verify
        * what it really contains.
        */
        // Disables dependency metadata when building APKs.
        includeInApk = false
        // Disables dependency metadata when building Android App Bundles.
        includeInBundle = false
    }

}

// new AGP9 DSL variant to rename release apk only
androidComponents {
    onVariants(selector().all()) { variant ->
        if (variant.buildType.equals("release")) {
            variant.outputs.forEach { output ->
                output.outputFileName.set("${base.archivesName.get()}.apk")
            }
        }
    }
}

