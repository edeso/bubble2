// count tags and use as Android versionCode
// https://developer.android.com/studio/publish/versioning
def getVersionCode = { ->
    def stream = providers.exec {
        commandLine 'git', 'tag', '--list'
        ignoreExitValue = true
    }.standardOutput

    def tagList = stream.asText.get()
    if (tagList.isEmpty())
        return 1
    return tagList.split("\n").size() as Integer
}

// use git describe to generate a version name looking like
// "<tag>-<number of commits since tag>-<8 char abbreviated commit name>"
def getVersionName = { ->
    def stream = providers.exec {
        commandLine "git", "describe", "--tags", "--long"
        ignoreExitValue = true
    }.standardOutput

    def latestTag = stream.asText.get().trim()
    if (latestTag.isEmpty())
        latestTag = "No Tags"
    return latestTag //.replaceAll("[^\\x00-\\x7F]", "")
}

